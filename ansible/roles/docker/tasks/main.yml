############################################################
# Install DNF Plugins
############################################################

- name: Install dnf plugins
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

############################################################
# Add Docker Repository
############################################################

- name: Add Docker CE Repository
  ansible.builtin.command:
    cmd: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
    creates: /etc/yum.repos.d/docker-ce.repo

############################################################
# Install Docker
############################################################

- name: Install Docker Packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

############################################################
# Enable Containerd
############################################################

- name: Enable containerd
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started

############################################################
# Enable Docker
############################################################

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

############################################################
# Add ec2-user to Docker group
############################################################

- name: Add ec2-user to docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true

############################################################
# Add Jenkins to Docker group
############################################################

- name: Add jenkins to docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  when: ansible_facts.get('os_family') == 'RedHat'

############################################################
# Restart Jenkins so it gets Docker group membership
############################################################

- name: Restart Jenkins
  ansible.builtin.service:
    name: jenkins
    state: restarted
  when: ansible_facts.get('os_family') == 'RedHat'

############################################################
# Verify Docker Service
############################################################

- name: Check Docker service
  ansible.builtin.command:
    cmd: systemctl is-active docker
  register: docker_service_status
  changed_when: false

- name: Display Docker service status
  ansible.builtin.debug:
    var: docker_service_status.stdout

############################################################
# Verify Docker Version
############################################################

- name: Docker Version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker Version
  ansible.builtin.debug:
    var: docker_version.stdout

############################################################
# Verify Docker Socket Permissions
############################################################

- name: Check Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket

- name: Display Docker socket information
  ansible.builtin.debug:
    msg: "{{ docker_socket.stat }}"
