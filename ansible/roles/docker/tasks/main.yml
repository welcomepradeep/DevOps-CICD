############################################################
# Install DNF Plugins
############################################################

- name: Install dnf plugins
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

############################################################
# Add Docker Repository
############################################################

- name: Add Docker CE Repository
  ansible.builtin.command:
    cmd: >
      dnf config-manager --add-repo
      https://download.docker.com/linux/rhel/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo

############################################################
# Install Docker
############################################################

- name: Install Docker Packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

############################################################
# Enable Containerd
############################################################

- name: Enable containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

############################################################
# Enable Docker
############################################################

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

############################################################
# Add ec2-user to Docker group
#
# Ansible connects using ec2-user.
############################################################

- name: Add ec2-user to docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
    become: true

############################################################
# Jenkins Server ONLY
#
# Jenkins user must already exist.
############################################################

- name: Check if Jenkins user exists
  ansible.builtin.getent:
    database: passwd
    key: jenkins
  register: jenkins_user_check
  failed_when: false
  changed_when: false
  when: "'jenkins' in group_names"

############################################################
# Add Jenkins to Docker group
#
# Equivalent to:
# sudo usermod -aG docker jenkins
############################################################

- name: Add Jenkins to Docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  become: true
  register: jenkins_docker_group
  when:
    - "'jenkins' in group_names"
    - jenkins_user_check.ansible_facts.getent_passwd.jenkins is defined

############################################################
# Restart Jenkins
#
# A running Jenkins process must be restarted so that its
# service process receives the updated supplementary groups.
############################################################

- name: Restart Jenkins after Docker group change
  ansible.builtin.systemd:
    name: jenkins
    state: restarted
  become: true
  when:
    - "'jenkins' in group_names"
    - jenkins_docker_group.changed | default(false)

############################################################
# Verify Jenkins group membership
############################################################

- name: Verify Jenkins Docker group membership
  ansible.builtin.command:
    cmd: id jenkins
  register: jenkins_id
  changed_when: false
  when:
    - "'jenkins' in group_names"
    - jenkins_user_check.ansible_facts.getent_passwd.jenkins is defined

- name: Display Jenkins groups
  ansible.builtin.debug:
    msg: "{{ jenkins_id.stdout }}"
  when:
    - jenkins_id is defined
    - jenkins_id.stdout is defined

############################################################
# Verify Jenkins Docker access
############################################################

- name: Test Docker access as Jenkins
  ansible.builtin.command:
    cmd: docker ps
  become: true
  become_user: jenkins
  register: jenkins_docker_test
  changed_when: false
  when:
    - "'jenkins' in group_names"
    - jenkins_user_check.ansible_facts.getent_passwd.jenkins is defined

- name: Display Jenkins Docker access result
  ansible.builtin.debug:
    msg: "Jenkins can access Docker successfully"
  when:
    - jenkins_docker_test is defined
    - jenkins_docker_test.rc | default(1) == 0

############################################################
# Verify Docker Service
############################################################

- name: Check Docker service
  ansible.builtin.command:
    cmd: systemctl is-active docker
  register: docker_service_status
  changed_when: false

- name: Display Docker service status
  ansible.builtin.debug:
    msg: "Docker service status: {{ docker_service_status.stdout }}"

############################################################
# Verify Docker Socket
############################################################

- name: Check Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket

- name: Display Docker socket
  ansible.builtin.debug:
    msg:
      - "Docker socket exists: {{ docker_socket.stat.exists }}"
      - "Docker socket owner: {{ docker_socket.stat.pw_name | default('unknown') }}"
      - "Docker socket group: {{ docker_socket.stat.gr_name | default('unknown') }}"
      - "Docker socket mode: {{ docker_socket.stat.mode | default('unknown') }}"

############################################################
# Verify Docker Version
############################################################

- name: Docker Version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker Version
  ansible.builtin.debug:
    msg: "{{ docker_version.stdout }}"
