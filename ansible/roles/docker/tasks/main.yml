############################################################
# Install DNF Plugins
############################################################

- name: Install dnf plugins
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

############################################################
# Add Docker Repository
############################################################

- name: Add Docker CE Repository
  ansible.builtin.command:
    cmd: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
    creates: /etc/yum.repos.d/docker-ce.repo

############################################################
# Install Docker
############################################################

- name: Install Docker Packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

############################################################
# Enable Containerd
############################################################

- name: Enable containerd
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started

############################################################
# Enable Docker
############################################################

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

############################################################
# Add ec2-user to Docker group
############################################################

- name: Add ec2-user to docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true


############################################################
# Add Jenkins to Docker group if Jenkins exists
############################################################

- name: Check whether Jenkins user exists
  ansible.builtin.getent:
    database: passwd
    key: jenkins
  register: jenkins_user
  failed_when: false

- name: Add Jenkins user to Docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  when:
    - jenkins_user.ansible_facts.getent_passwd.jenkins is defined
  register: jenkins_docker_group

- name: Restart Jenkins when Docker group membership changes
  ansible.builtin.systemd:
    name: jenkins
    state: restarted
  when:
    - jenkins_user.ansible_facts.getent_passwd.jenkins is defined
    - jenkins_docker_group.changed

############################################################
# Verify Jenkins Docker Access
############################################################

- name: Verify Jenkins can access Docker
  ansible.builtin.command:
    cmd: docker ps
  become: true
  become_user: jenkins
  register: jenkins_docker_test
  changed_when: false
  when:
    - jenkins_user.ansible_facts.getent_passwd.jenkins is defined

- name: Display Jenkins Docker access result
  ansible.builtin.debug:
    msg: "Jenkins Docker access verified successfully"
  when:
    - jenkins_user.ansible_facts.getent_passwd.jenkins is defined
    - jenkins_docker_test.rc == 0

############################################################
# Verify Docker Service
############################################################

- name: Check Docker service
  ansible.builtin.command:
    cmd: systemctl is-active docker
  register: docker_service_status
  changed_when: false

- name: Display Docker service status
  ansible.builtin.debug:
    msg: "Docker service status: {{ docker_service_status.stdout }}"

############################################################
# Verify Docker Socket
############################################################

- name: Check Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket


- name: Display Docker socket
  ansible.builtin.debug:
    msg:
      - "Docker socket exists: {{ docker_socket.stat.exists }}"
      - "Docker socket owner: {{ docker_socket.stat.pw_name | default('unknown') }}"
      - "Docker socket group: {{ docker_socket.stat.gr_name | default('unknown') }}"



############################################################
# Verify Docker Version
############################################################

- name: Docker Version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker Version
  ansible.builtin.debug:
    msg: "{{ docker_version.stdout }}"

############################################################
# Verify Docker Socket Permissions
############################################################

- name: Check Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket

- name: Display Docker socket information
  ansible.builtin.debug:
    msg: "{{ docker_socket.stat }}"
