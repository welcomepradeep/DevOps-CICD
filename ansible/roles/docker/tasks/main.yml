############################################################
# Install DNF Plugins
############################################################

- name: Install dnf plugins
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present


############################################################
# Add Docker Repository
############################################################

- name: Add Docker CE Repository
  ansible.builtin.command:
    cmd: >
      dnf config-manager --add-repo
      https://download.docker.com/linux/rhel/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo


############################################################
# Install Docker
############################################################

- name: Install Docker Packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present


############################################################
# Enable Containerd
############################################################

- name: Enable containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started


############################################################
# Enable Docker
############################################################

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started


############################################################
# Add EC2 user to Docker group
# This applies to both Jenkins and Web servers
############################################################

- name: Add ec2-user to docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true


############################################################
# Jenkins-specific configuration
# ONLY runs on Jenkins server
############################################################

- name: Check whether Jenkins user exists
  ansible.builtin.getent:
    database: passwd
    key: jenkins
  register: jenkins_user
  failed_when: false
  when: "'jenkins' in group_names"


############################################################
# Add Jenkins to Docker group
############################################################

- name: Check Jenkins supplementary groups
  ansible.builtin.command:
    cmd: id -nG jenkins
  register: jenkins_groups
  changed_when: false
  when:
    - "'jenkins' in group_names"
    - jenkins_user.ansible_facts.getent_passwd.jenkins is defined


- name: Add Jenkins to Docker group
  ansible.builtin.command:
    cmd: usermod -aG docker jenkins
  register: jenkins_docker_group
  changed_when: true
  when:
    - "'jenkins' in group_names"
    - jenkins_user.ansible_facts.getent_passwd.jenkins is defined
    - "'docker' not in jenkins_groups.stdout.split()"


############################################################
# Restart Jenkins after Docker group change
############################################################

- name: Restart Jenkins
  ansible.builtin.systemd:
    name: jenkins
    state: restarted
  when:
    - "'jenkins' in group_names"
    - jenkins_docker_group.changed | default(false)


############################################################
# Verify Jenkins Docker group membership
############################################################

- name: Verify Jenkins Docker group membership
  ansible.builtin.command:
    cmd: id jenkins
  register: jenkins_id
  changed_when: false
  when:
    - "'jenkins' in group_names"
    - jenkins_user.ansible_facts.getent_passwd.jenkins is defined


############################################################
# Display Jenkins groups
############################################################

- name: Display Jenkins groups
  ansible.builtin.debug:
    var: jenkins_id.stdout
  when:
    - "'jenkins' in group_names"
    - jenkins_id is defined

############################################################
# Verify Docker Service
############################################################

- name: Check Docker service
  ansible.builtin.command:
    cmd: systemctl is-active docker
  register: docker_service_status
  changed_when: false

- name: Display Docker service status
  ansible.builtin.debug:
    msg: "Docker service status: {{ docker_service_status.stdout }}"

############################################################
# Verify Docker Socket
############################################################

- name: Check Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket


- name: Display Docker socket
  ansible.builtin.debug:
    msg:
      - "Docker socket exists: {{ docker_socket.stat.exists }}"
      - "Docker socket owner: {{ docker_socket.stat.pw_name | default('unknown') }}"
      - "Docker socket group: {{ docker_socket.stat.gr_name | default('unknown') }}"



############################################################
# Verify Docker Version
############################################################

- name: Docker Version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker Version
  ansible.builtin.debug:
    msg: "{{ docker_version.stdout }}"

############################################################
# Verify Docker Socket Permissions
############################################################

- name: Check Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket

- name: Display Docker socket information
  ansible.builtin.debug:
    msg: "{{ docker_socket.stat }}"
