############################################################
# Install Nginx
############################################################

- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present


############################################################
# Install SELinux Required Packages
############################################################

- name: Install required SELinux packages
  ansible.builtin.dnf:
    name:
      - policycoreutils-python-utils
    state: present


############################################################
# Allow Nginx to Connect to Docker Upstream
############################################################

- name: Enable SELinux httpd network connections
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true


############################################################
# Configure Firewall
############################################################

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present


- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started


- name: Allow HTTP through firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true


- name: Allow HTTPS through firewalld
  ansible.posix.firewalld:
    service: https
    permanent: true
    state: enabled
    immediate: true

############################################################
# Disable Default Nginx Server
############################################################

- name: Remove default Nginx server configuration
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent


############################################################
# Create Clean Nginx Main Configuration
############################################################

- name: Create clean Nginx main configuration
  ansible.builtin.copy:
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      user nginx;
      worker_processes auto;

      error_log /var/log/nginx/error.log;
      pid /run/nginx.pid;

      include /usr/share/nginx/modules/*.conf;

      events {
          worker_connections 1024;
      }

      http {
          log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

          access_log /var/log/nginx/access.log main;

          sendfile on;
          tcp_nopush on;
          tcp_nodelay on;
          keepalive_timeout 65;
          types_hash_max_size 4096;

          include /etc/nginx/mime.types;
          default_type application/octet-stream;

          include /etc/nginx/conf.d/*.conf;
      }
  notify:
    - Restart Nginx


############################################################
# Create DevOps CI/CD Nginx Configuration
############################################################

- name: Create DevOps CI/CD Nginx configuration
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/devops-cicd.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          location / {
              proxy_pass http://127.0.0.1:8080;

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          error_page 500 502 503 504 /50x.html;

          location = /50x.html {
              root /usr/share/nginx/html;
          }
      }
  notify:
    - Restart Nginx


############################################################
# Validate Nginx Configuration
############################################################

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false


############################################################
# Enable and Start Nginx
############################################################

- name: Enable Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started


############################################################
# Verify Nginx
############################################################

- name: Verify Nginx service
  ansible.builtin.command:
    cmd: systemctl is-active nginx
  register: nginx_status
  changed_when: false

- name: Display Nginx status
  ansible.builtin.debug:
    msg: "Nginx status: {{ nginx_status.stdout }}"

############################################################
# Verify HTTP Firewall
############################################################

- name: Check HTTP firewall service
  ansible.builtin.command:
    cmd: firewall-cmd --list-services
  register: firewall_services
  changed_when: false

- name: Display firewall services
  ansible.builtin.debug:
    msg: "Firewall services: {{ firewall_services.stdout }}"
